services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: game_price
      POSTGRES_USER: game_price
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_price -d game_price"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
